<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp học · Quản lý bài thi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import * as db from "../lib/db.js";
import * as ui from "../lib/ui.js";
const { esc } = ui;
const main = await ui.shell("teacher", "classes");
main.innerHTML = `<div class="page-head"><h1>Lớp học</h1><button class="btn primary" id="new">Thêm lớp</button></div><div id="list"></div>`;
const listEl = main.querySelector("#list");
const open = new Set();
// Link riêng cho từng học sinh. Next.js: `${origin}/p/${token}`.
const linkOf = (s) => new URL(`../parent/index.html?t=${s.token}`, location.href).href;

async function render() {
  listEl.innerHTML = ui.skeleton(2);
  try {
    const classes = await db.listClasses();
    if (!classes.length) { listEl.innerHTML = ui.empty("Chưa có lớp nào.", '<button class="btn primary" data-new>Thêm lớp</button>'); return; }
    const byClass = await Promise.all(classes.map((c) => db.listStudents({ classId: c.id })));
    listEl.innerHTML = `<div class="stack">${classes.map((c, i) => `
      <details class="panel" data-class="${c.id}"${open.has(c.id) ? " open" : ""}>
        <summary><span>${esc(c.name)} <span class="muted small">· ${esc(c.year)} · ${c.student_count} học sinh</span></span><span class="chev" aria-hidden="true"></span></summary>
        ${byClass[i].length ? `<ul class="list">${byClass[i].map((s) => `
          <li><div class="row"><span class="title">${esc(s.name)}</span>
            <span class="foot">${s.opened ? '<span class="badge success">Phụ huynh đã mở</span>' : '<span class="badge">Chưa mở</span>'}
              <span class="actions"><button class="btn" data-copy="${linkOf(s)}" aria-label="Chép link xem bài của ${esc(s.name)}">Chép link</button><button class="btn ghost" data-reset="${s.id}" aria-label="Đổi link của ${esc(s.name)}">Đổi link</button></span></span></div></li>`).join("")}</ul>`
          : '<p class="muted">Lớp chưa có học sinh.</p>'}
        <div class="actions" style="margin-top: var(--space-3)"><button class="btn" data-add-students="${c.id}">Thêm học sinh</button></div>
      </details>`).join("")}</div>`;
  } catch {
    listEl.innerHTML = ui.errorBox("Không tải được danh sách lớp.");
  }
}

main.addEventListener("toggle", (e) => { const id = e.target.dataset?.class; if (id) e.target.open ? open.add(id) : open.delete(id); }, true);
main.addEventListener("click", async (e) => {
  if (e.target.closest("[data-retry]")) render();
  if (e.target.closest("#new, [data-new]")) newClass();
  const add = e.target.closest("[data-add-students]");
  if (add) addStudents(add.dataset.addStudents);
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await ui.copyText(copy.dataset.copy); ui.toast("Đã chép link. Gửi cho phụ huynh qua Zalo hoặc tin nhắn."); }
    catch { ui.toast("Không chép được link.", "error"); }
  }
  const reset = e.target.closest("[data-reset]");
  if (reset && confirm("Đổi link xem bài của học sinh này? Link cũ sẽ không dùng được nữa, bạn cần gửi lại link mới cho phụ huynh.")) {
    await db.resetToken(reset.dataset.reset);
    ui.toast("Đã đổi link. Bấm Chép link để lấy link mới.");
    render();
  }
});

function newClass() {
  const d = ui.sheet("Thêm lớp", `<form class="stack" novalidate>
    <div class="field"><label for="name">Tên lớp</label><input id="name" name="name" placeholder="7A3" autocomplete="off" aria-describedby="name-err"><span class="err" id="name-err"></span></div>
    <div class="field"><label for="year">Năm học</label><input id="year" name="year" value="2026-2027" inputmode="numeric"></div>
    <div class="actions"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary">Thêm lớp</button></div></form>`);
  const f = d.querySelector("form");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!f.name.value.trim()) { f.name.setAttribute("aria-invalid", "true"); d.querySelector("#name-err").textContent = "Nhập tên lớp, ví dụ: 7A3."; f.name.focus(); return; }
    const id = await db.createClass({ name: f.name.value.trim(), year: f.year.value.trim() });
    open.add(id); d.close(); ui.toast("Đã thêm lớp."); render();
  });
}

function addStudents(classId) {
  const d = ui.sheet("Thêm học sinh", `<form class="stack" novalidate>
    <div class="field"><label for="names">Họ tên học sinh</label><textarea id="names" rows="6" placeholder="Nguyễn Văn An&#10;Trần Thị Bình" aria-describedby="names-err"></textarea><span class="hint">Mỗi dòng một học sinh. Dán từ Excel được.</span><span class="err" id="names-err"></span></div>
    <div class="actions"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary">Thêm</button></div></form>`);
  const f = d.querySelector("form");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const names = f.names.value.split("\n");
    if (!names.some((n) => n.trim())) { f.names.setAttribute("aria-invalid", "true"); d.querySelector("#names-err").textContent = "Nhập ít nhất một họ tên."; f.names.focus(); return; }
    const n = await db.createStudents(classId, names);
    open.add(classId); d.close(); ui.toast(`Đã thêm ${n} học sinh.`); render();
  });
}
await render();
</script>
</body>
</html>
