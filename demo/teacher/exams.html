<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài thi · Quản lý bài thi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import * as db from "../lib/db.js";
import * as ui from "../lib/ui.js";
const { esc } = ui;
const main = await ui.shell("teacher", "exams");
const [classes, subjects, types] = await Promise.all([db.listClasses(), db.listSubjects(), db.listExamTypes()]);
const multi = subjects.length > 1; // 1 môn: ẩn ô chọn môn
let filter = {};

main.innerHTML = `
  <div class="page-head"><h1>Bài thi</h1>
    <div class="actions"><button class="btn" id="filter">Lọc</button><button class="btn primary" id="new">Tạo bài thi</button></div>
  </div><div id="list"></div>`;
const listEl = main.querySelector("#list");

async function render() {
  const n = ui.countFilters(filter);
  main.querySelector("#filter").textContent = n ? `Lọc (${n})` : "Lọc";
  listEl.innerHTML = ui.skeleton();
  try {
    const exams = await db.listExams(filter);
    if (!exams.length) {
      listEl.innerHTML = ui.empty(n ? "Không có bài thi khớp bộ lọc." : "Chưa có bài thi nào.", n ? '<button class="btn" data-clear>Xóa lọc</button>' : '<button class="btn primary" data-new>Tạo bài thi</button>');
      return;
    }
    listEl.innerHTML = `<ul class="list">${exams.map((e) => `
      <li><a class="row" href="exam.html?id=${e.id}">
        <span class="title">${esc(e.title)}</span>
        <span class="badge ${e.published === e.total ? "success" : ""} num">${e.published}/${e.total} đã đăng</span>
        <span class="meta"><span class="badge info">${esc(e.class.name)}</span> ${esc(e.subject.name)} · ${esc(e.type.name)} · ${ui.fmtDate(e.date)}</span>
      </a></li>`).join("")}</ul>`;
  } catch (err) {
    listEl.innerHTML = ui.errorBox("Không tải được danh sách bài thi.");
  }
}

main.addEventListener("click", (e) => {
  if (e.target.closest("[data-retry]")) render();
  if (e.target.closest("[data-clear]")) { filter = {}; render(); }
  if (e.target.closest("#new, [data-new]")) newExam();
});
main.querySelector("#filter").addEventListener("click", () =>
  ui.filterSheet([
    { key: "classId", label: "Lớp", items: classes }, ...(multi ? [{ key: "subjectId", label: "Môn", items: subjects }] : []),
    { key: "typeId", label: "Loại bài", items: types }, { key: "term", label: "Học kỳ", items: db.TERMS.map((t) => ({ id: t, name: t })) },
  ], filter, (v) => { filter = v; render(); }));

function newExam() {
  if (!classes.length) { ui.toast("Tạo lớp trước khi tạo bài thi.", "error"); return; }
  const today = new Date().toISOString().slice(0, 10);
  const classField = `<div class="field"><label for="class_id">Lớp</label><select id="class_id" name="class_id">${ui.opts(classes)}</select></div>`;
  const subjectField = `<div class="field"><label for="subject_id">Môn</label><select id="subject_id" name="subject_id">${ui.opts(subjects)}</select></div>`;
  const d = ui.sheet("Tạo bài thi", `<form class="stack" novalidate>
    <div class="field"><label for="title">Tên bài thi</label><input id="title" name="title" placeholder="Kiểm tra 15 phút Toán" autocomplete="off" aria-describedby="title-err"><span class="err" id="title-err"></span></div>
    ${multi ? `<div class="field-row">${classField}${subjectField}</div>` : `${classField}<input type="hidden" name="subject_id" value="${subjects[0].id}">`}
    <div class="field-row">
      <div class="field"><label for="type_id">Loại bài</label><select id="type_id" name="type_id">${ui.opts(types)}</select></div>
      <div class="field"><label for="term">Học kỳ</label><select id="term" name="term">${ui.opts(db.TERMS.map((t) => ({ id: t, name: t })))}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="date">Ngày thi</label><input id="date" name="date" type="date" value="${today}"></div>
      <div class="field"><label for="max_score">Điểm tối đa</label><input id="max_score" name="max_score" type="text" inputmode="decimal" value="10"></div>
    </div>
    <div class="actions"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary">Tạo bài thi</button></div></form>`);
  const form = d.querySelector("form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const max = ui.parseScore(f.max_score);
    if (!f.title.trim()) {
      form.title.setAttribute("aria-invalid", "true");
      d.querySelector("#title-err").textContent = "Nhập tên bài thi, ví dụ: Kiểm tra 15 phút Toán.";
      form.title.focus();
      return;
    }
    const btn = form.querySelector(".primary"); btn.disabled = true; btn.textContent = "Đang tạo...";
    const id = await db.createExam({ ...f, title: f.title.trim(), max_score: max > 0 ? max : 10 });
    location.href = `exam.html?id=${id}`;
  });
}
await render();
</script>
</body>
</html>
